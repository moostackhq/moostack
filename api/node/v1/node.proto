syntax = "proto3";

// The node API: what a node's agent and updater serve about that one
// node.
package moostack.node.v1;

option go_package = "github.com/moostackhq/moostack/api/node/v1;nodev1";

// Agent is the node API that the agent serves.
service Agent {
  // Status reports the node's mode and the state of its node components.
  rpc Status(StatusRequest) returns (StatusResponse);
  // RecordGeneration records the generation of the cluster directory that
  // the node has applied, with the directory's nodes. It refuses a
  // generation lower than the one recorded, with FAILED_PRECONDITION,
  // unless the node can't tell the one recorded.
  rpc RecordGeneration(RecordGenerationRequest) returns (RecordGenerationResponse);
}

// Updater is the node API that the updater serves, on its own socket, so
// that it answers whatever state the agent is in.
service Updater {
  // Status reports the updater's own state.
  rpc Status(UpdaterStatusRequest) returns (UpdaterStatusResponse);
}

message StatusRequest {}

message StatusResponse {
  Mode mode = 1;
  // Components are the node components, the agent among them. The
  // updater reports itself.
  repeated Component components = 2;
  // Generation is the generation of the cluster directory that the node
  // last applied, 0 if none or if generation_unknown says why the node
  // can't tell.
  int64 generation = 3;
  // Nodes are the names of the nodes in the cluster directory at that
  // generation.
  repeated string nodes = 4;
  // GenerationUnknown says why the node can't tell the generation it last
  // applied, such as a file it can't read. It is empty when it can.
  string generation_unknown = 5;
}

// RecordGenerationRequest is a generation of the cluster directory that
// the node has applied.
message RecordGenerationRequest {
  // Generation is the cluster directory's generation.
  int64 generation = 1;
  // Nodes are the names of the nodes in the cluster directory at that
  // generation.
  repeated string nodes = 2;
}

message RecordGenerationResponse {}

message UpdaterStatusRequest {}

message UpdaterStatusResponse {
  // Updater is the updater itself.
  Component updater = 1;
}

// Mode is how the node is operated.
enum Mode {
  MODE_UNSPECIFIED = 0;
  // MODE_DIRECT is operated by mooctl over SSH.
  MODE_DIRECT = 1;
  // MODE_CONTROL_PLANE is operated by a control plane.
  MODE_CONTROL_PLANE = 2;
}

// Component is a node component as the agent or the updater sees it.
message Component {
  // Name is agent, updater or containerd.
  string name = 1;
  // Version is empty when the agent can't tell it.
  string version = 2;
  Health health = 3;
  // Problem says why the component is unhealthy.
  string problem = 4;
}

enum Health {
  HEALTH_UNSPECIFIED = 0;
  HEALTH_HEALTHY = 1;
  HEALTH_UNHEALTHY = 2;
}
