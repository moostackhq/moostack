syntax = "proto3";

// The node API: what a node's agent and updater serve about that one
// node.
package moostack.node.v1;

option go_package = "github.com/moostackhq/moostack/api/node/v1;nodev1";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// Agent is the node API that the agent serves. On a node in control
// plane mode, the agent's local socket serves only Status and Detach,
// and refuses every other call, the cluster services' included, with
// FAILED_PRECONDITION, so that the node is never operated in both modes.
service Agent {
  // Status reports the node's mode and the state of its node components.
  rpc Status(StatusRequest) returns (StatusResponse);
  // RecordGeneration records the generation of the cluster directory that
  // the node has applied, with the directory's nodes. It refuses a
  // generation lower than the one recorded, with FAILED_PRECONDITION,
  // unless the node can't tell the one recorded, and refuses it with
  // FAILED_PRECONDITION unless the request's lease holds the operation
  // lock.
  rpc RecordGeneration(RecordGenerationRequest) returns (RecordGenerationResponse);
  // AcquireLock grants the operation lock to the request's lease, if no
  // other lease holds it, or renews it for the lease that does. Either
  // way the lease holds it for ttl from when the agent got the call. It
  // answers with the lock as it now is, held by the request's lease or
  // by another.
  rpc AcquireLock(AcquireLockRequest) returns (AcquireLockResponse);
  // RenewLock renews the operation lock for the request's lease, for ttl
  // from when the agent got the call, only if that lease still holds it:
  // a lease that was broken or ran out never gets it back this way. It
  // answers with the lock as it now is, unset if free.
  rpc RenewLock(RenewLockRequest) returns (RenewLockResponse);
  // ReleaseLock releases the operation lock, if the request's lease holds
  // it.
  rpc ReleaseLock(ReleaseLockRequest) returns (ReleaseLockResponse);
  // BreakLock releases the operation lock, whichever lease holds it, and
  // answers with the lock it broke.
  rpc BreakLock(BreakLockRequest) returns (BreakLockResponse);
  // ImportImage imports an image into the node's containerd, from an OCI
  // image layout archive that the requests carry in chunks, in order. It
  // answers with the names of the images it imported. Importing an image
  // the node has changes nothing. It is refused with FAILED_PRECONDITION,
  // importing nothing, unless the first request's lease holds the
  // operation lock, and for an image for another platform than the
  // node's, by its config or by what the archive's index says of it,
  // which leaves an image of its name as it was.
  rpc ImportImage(stream ImportImageRequest) returns (ImportImageResponse);
  // PullImage pulls a public image into the node's containerd, by a
  // reference normalized as Docker normalizes one, such as
  // docker.io/library/nginx:1.27, and unpacks it. A pull of an image the
  // node has fetches only what it lacks. It refuses, with
  // INVALID_ARGUMENT, a reference that isn't normalized, and, with
  // FAILED_PRECONDITION, an image for another platform than the node's,
  // and the pull unless the request's lease holds the operation lock,
  // pulling nothing. A failed pull answers NOT_FOUND for an image the
  // registry doesn't have, PERMISSION_DENIED for one it denies access to,
  // RESOURCE_EXHAUSTED at the registry's first answer that the node is
  // rate limited, with no retry, and UNAVAILABLE for a registry that
  // can't be reached. The pull ends when its call ends.
  rpc PullImage(PullImageRequest) returns (PullImageResponse);
  // Run runs a container from its image, which the node must have, and
  // keeps it running across restarts of the agent, of containerd and of
  // the node. The container gets no-new-privileges, a cgroup of its
  // own, and a network namespace of its own with loopback alone. Its
  // output goes to the node's log as <name>.log. Running a container as
  // it runs already, from the same build of the same image with the same
  // properties, changes nothing, and one that runs the same build under
  // another name of its image takes the new name in place; otherwise the
  // container of that name is replaced, and if the new one can't be made,
  // the old one runs on.
  // Once the agent has the call, it goes on even if the call ends. It is
  // refused with FAILED_PRECONDITION, changing nothing, unless the
  // request's lease holds the operation lock, if the node lacks the
  // image, or if a container of another name serves its API.
  rpc Run(RunRequest) returns (RunResponse);
  // Remove stops and deletes the container of the request's name, and
  // empties its log; removing one the node doesn't keep succeeds. It
  // answers whether the node kept one. It waits for a run or a removal
  // under way to end, and answers as that left the node. Once the agent
  // has the call, it goes on even if the call ends. It is refused with
  // FAILED_PRECONDITION, changing nothing, unless the request's lease
  // holds the operation lock.
  rpc Remove(RemoveRequest) returns (RemoveResponse);
  // RemoveIdentities adds node identities, by their fingerprints, to
  // those the node holds as removed from the cluster, and refuses peers
  // that prove one from then on, cutting off their open connections. The
  // node keeps the identities it held already, so the list only grows.
  // It refuses the request with FAILED_PRECONDITION unless the request's
  // lease holds the operation lock.
  rpc RemoveIdentities(RemoveIdentitiesRequest) returns (RemoveIdentitiesResponse);
  // UpdateUpdater replaces the updater with the binary that the requests
  // carry, as the updater's UpdateAgent replaces the agent, and with the
  // same answers: the new updater must serve its status at the update's
  // version, healthy, or the old one is put back. An update cut off by a
  // crash of the agent is rolled back when the agent starts again, and
  // another update of the updater is refused until it is.
  rpc UpdateUpdater(stream UpdateUpdaterRequest) returns (UpdateUpdaterResponse);
  // UpdateContainerd replaces containerd's binaries with those that the
  // requests carry: the first says which containerd they are, and every
  // request carries the next bytes of one of them, each file's in order.
  // It answers once containerd serves at the update's version with its
  // shim at the same version. If it doesn't within the update's health
  // timeout, the old containerd is put back and the call fails with
  // ABORTED, or with INTERNAL if the old one doesn't serve within the
  // health timeout either. Running containers keep running. It refuses,
  // with INVALID_ARGUMENT, binaries that don't match their checksums, a
  // file that isn't one of containerd's, and an update without each of
  // them, and, with FAILED_PRECONDITION, an update while another runs,
  // changing nothing. Once the agent has the binaries, the update goes on
  // even if the call ends.
  rpc UpdateContainerd(stream UpdateContainerdRequest) returns (UpdateContainerdResponse);
  // Detach is the break-glass detach: it returns a node in control plane
  // mode to direct mode, for good, once the control plane is lost. The
  // agent leaves the control plane and lifts the local socket's lockout,
  // and the updater follows within seconds, reporting direct mode in its
  // status. It is refused over the control plane's tunnel with
  // PERMISSION_DENIED, since only root on the node may detach it, and on
  // a node in direct mode with FAILED_PRECONDITION.
  rpc Detach(DetachRequest) returns (DetachResponse);
}

// Updater is the node API that the updater serves, on its own socket, so
// that it answers whatever state the agent is in. On a node in control
// plane mode, the updater's local socket serves only Status, and refuses
// its other methods with FAILED_PRECONDITION.
service Updater {
  // Status reports the updater's own state.
  rpc Status(UpdaterStatusRequest) returns (UpdaterStatusResponse);
  // UpdateAgent replaces the agent with the binary that the requests
  // carry: the first says which agent it is, and every request carries
  // the binary's next bytes, in order. It answers once the new agent
  // serves its status at the update's version with every component it
  // reports healthy. If it doesn't within the update's health timeout,
  // the old agent is put back and the call fails with ABORTED, or with
  // INTERNAL if the old one doesn't become healthy within the health
  // timeout either, or if the update can't be recorded as finished, in
  // which case it is rolled back when the updater next starts. It
  // refuses a binary that doesn't match the update's checksum with
  // INVALID_ARGUMENT, and, with FAILED_PRECONDITION, an update while
  // another runs or while one cut off is still to be rolled back,
  // changing nothing. Once it has the whole binary, the update goes on
  // even if the call ends, and an updater told to stop finishes it
  // first. An update cut off by a crash of the updater is rolled back
  // when it starts again.
  rpc UpdateAgent(stream UpdateAgentRequest) returns (UpdateAgentResponse);
}

message StatusRequest {}

message StatusResponse {
  Mode mode = 1;
  // Components are the node components, the agent among them. The
  // updater reports itself.
  repeated Component components = 2;
  // Generation is the generation of the cluster directory that the node
  // last applied, 0 if none or if generation_unknown says why the node
  // can't tell.
  int64 generation = 3;
  // Nodes are the names of the nodes in the cluster directory at that
  // generation.
  repeated string nodes = 4;
  // GenerationUnknown says why the node can't tell the generation it last
  // applied, such as a file it can't read. It is empty when it can.
  string generation_unknown = 5;
  // Lock is the operation lock, unset if no lease holds it.
  Lock lock = 6;
  // Containers are the containers the node keeps, the cluster services
  // among them, each as it runs.
  repeated ContainerStatus containers = 7;
}

// ContainerStatus is a container as the node runs it.
message ContainerStatus {
  string name = 1;
  // Image is the name of the image the container was made from, and
  // digest the digest of that image's build, each empty if the node
  // can't tell, as when it can't read the container or has none.
  string image = 2;
  string digest = 3;
  TaskState state = 4;
  // ExitCode is the code the container exited with, in TASK_STATE_EXITED.
  uint32 exit_code = 5;
  // Health is unspecified for a container without an API, and otherwise
  // says whether its API answers its health call without a problem.
  Health health = 6;
  // Problem says why the container's last start failed, if it did, as
  // when the one that was to replace it couldn't be made; or else why it
  // failed, in TASK_STATE_FAILED, or why its API is unhealthy.
  string problem = 7;
}

// TaskState is whether a container's process runs.
enum TaskState {
  // TASK_STATE_UNSPECIFIED is a container whose state the node can't
  // tell.
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_RUNNING = 1;
  // TASK_STATE_EXITED is a process that ran and exited.
  TASK_STATE_EXITED = 2;
  // TASK_STATE_FAILED is a container whose process doesn't run for
  // another reason, such as one that failed to start.
  TASK_STATE_FAILED = 3;
}

// RecordGenerationRequest is a generation of the cluster directory that
// the node has applied.
message RecordGenerationRequest {
  // Generation is the cluster directory's generation.
  int64 generation = 1;
  // Nodes are the names of the nodes in the cluster directory at that
  // generation.
  repeated string nodes = 2;
  // Lease is the operation's lease, which must hold the operation lock.
  string lease = 3;
}

message RecordGenerationResponse {}

// Lock is the operation lock, as one operation's lease holds it.
message Lock {
  // Lease identifies the operation's hold on the lock.
  string lease = 1;
  // Holder is who runs the operation, and machine where.
  string holder = 2;
  string machine = 3;
  // Since is when the node granted the lease. A request leaves it unset.
  google.protobuf.Timestamp since = 4;
  // Until is when the lease runs out on the node unless renewed, on the
  // node's clock. A request leaves it unset.
  google.protobuf.Timestamp until = 5;
  // Operation is the command the operation runs, such as "cluster
  // update", empty from a release that didn't say.
  string operation = 6;
}

message AcquireLockRequest {
  Lock lock = 1;
  // Ttl is how long the lease holds the lock unless renewed.
  google.protobuf.Duration ttl = 2;
}

message AcquireLockResponse {
  // Lock is the lock as it now is.
  Lock lock = 1;
}

message RenewLockRequest {
  string lease = 1;
  google.protobuf.Duration ttl = 2;
}

message RenewLockResponse {
  // Lock is the lock as it now is, unset if free.
  Lock lock = 1;
}

message ReleaseLockRequest {
  string lease = 1;
}

message ReleaseLockResponse {}

message BreakLockRequest {}

message BreakLockResponse {
  // Broken is the lock that was broken, unset if no lease held it.
  Lock broken = 1;
}

message ImportImageRequest {
  // Chunk is the archive's next bytes.
  bytes chunk = 1;
  // Lease is the operation's lease, which must hold the operation lock,
  // in the first request; the agent reads it from no other.
  string lease = 2;
}

message ImportImageResponse {
  // Images are the names of the images imported.
  repeated string images = 1;
}

message PullImageRequest {
  // Reference is the image's, normalized.
  string reference = 1;
  // Lease is the operation's lease, which must hold the operation lock.
  string lease = 2;
}

message PullImageResponse {
  // Image is the name of the image pulled, which is its reference, and
  // digest the digest of the build pulled.
  string image = 1;
  string digest = 2;
}

// Container is a container as Run runs it: its name, its image and its
// properties.
message Container {
  // Name is the container's, of lowercase letters, digits and hyphens,
  // starting with a letter, at most 63. It names the container's log.
  string name = 1;
  // Image is the name of an image the node has.
  string image = 2;
  // User is the uid to run as, with a gid after a colon, each a number
  // of at most 2147483647, never a name. The image's user if unset.
  optional string user = 3;
  bool read_only_root = 4;
  // Capabilities are the capabilities to run with, a default set if
  // unset, and none if set and empty.
  Capabilities capabilities = 5;
  // Api is the gRPC service name of an API the container serves on the
  // socket that api/service/v1 names, which the agent routes calls of
  // the API to and asks for its health. Unset, it serves none.
  //
  // Temporary: the routed API is taken in Run beside the properties,
  // which say how a container runs, until it gets a design of its own.
  string api = 6;
}

// Capabilities are Linux capabilities, as the kernel names them, such as
// CAP_NET_BIND_SERVICE.
message Capabilities {
  repeated string names = 1;
}

message RunRequest {
  Container container = 1;
  // Lease is the operation's lease, which must hold the operation lock.
  string lease = 2;
}

message RunResponse {
  // Started says the run started the container's process, as one made
  // anew or one whose process had stopped; it is false for a container
  // that ran as asked already, or took a new name of its image in place.
  bool started = 1;
}

message RemoveRequest {
  // Name is the container's.
  string name = 1;
  // Lease is the operation's lease, which must hold the operation lock.
  string lease = 2;
}

message RemoveResponse {
  // Removed says the node kept a container of the request's name, which
  // it removed.
  bool removed = 1;
}

message RemoveIdentitiesRequest {
  // Identities are the fingerprints of the removed identities: each the
  // SHA-256 of the certificate, hex, after "sha256:".
  repeated string identities = 1;
  // Lease is the operation's lease, which must hold the operation lock.
  string lease = 2;
}

message RemoveIdentitiesResponse {}

message UpdaterStatusRequest {}

message UpdaterStatusResponse {
  // Updater is the updater itself.
  Component updater = 1;
  // Mode is the mode the updater serves in, unspecified from a release
  // before the updater said.
  Mode mode = 2;
}

message UpdateAgentRequest {
  // Update says which agent the binary is. The first request carries it,
  // and the others don't.
  AgentUpdate update = 1;
  // Chunk is the binary's next bytes.
  bytes chunk = 2;
}

// AgentUpdate is the agent that an update installs.
message AgentUpdate {
  // Version is the version the new agent reports.
  string version = 1;
  // Sha256 is the binary's SHA-256, hex.
  string sha256 = 2;
  // HealthTimeout is how long the new agent has to become healthy.
  google.protobuf.Duration health_timeout = 3;
}

message UpdateAgentResponse {}

message UpdateUpdaterRequest {
  // Update says which updater the binary is. The first request carries
  // it, and the others don't.
  UpdaterUpdate update = 1;
  // Chunk is the binary's next bytes.
  bytes chunk = 2;
}

// UpdaterUpdate is the updater that an update installs.
message UpdaterUpdate {
  // Version is the version the new updater reports.
  string version = 1;
  // Sha256 is the binary's SHA-256, hex.
  string sha256 = 2;
  // HealthTimeout is how long the new updater has to become healthy.
  google.protobuf.Duration health_timeout = 3;
}

message UpdateUpdaterResponse {}

message UpdateContainerdRequest {
  // Update says which containerd the binaries are. The first request
  // carries it, and the others don't.
  ContainerdUpdate update = 1;
  // File is the name of the file that chunk is the next bytes of, one of
  // the update's files.
  string file = 2;
  bytes chunk = 3;
}

// ContainerdUpdate is the containerd that an update installs.
message ContainerdUpdate {
  // Version is the version the new containerd reports, without the
  // leading v.
  string version = 1;
  // Files are containerd's binaries, each of them.
  repeated ContainerdFile files = 2;
  // HealthTimeout is how long the new containerd has to restart and
  // answer.
  google.protobuf.Duration health_timeout = 3;
}

// ContainerdFile is one of containerd's binaries.
message ContainerdFile {
  // Name is the binary's, such as containerd.
  string name = 1;
  // Sha256 is the binary's SHA-256, hex.
  string sha256 = 2;
}

message UpdateContainerdResponse {}

message DetachRequest {}

message DetachResponse {}

// Mode is how the node is operated.
enum Mode {
  MODE_UNSPECIFIED = 0;
  // MODE_DIRECT is operated by mooctl over SSH.
  MODE_DIRECT = 1;
  // MODE_CONTROL_PLANE is operated by a control plane.
  MODE_CONTROL_PLANE = 2;
}

// Component is a node component or a cluster service as the agent or the
// updater sees it.
message Component {
  // Name is agent, updater or containerd, or the cluster service's.
  string name = 1;
  // Version is empty when the agent can't tell it.
  string version = 2;
  Health health = 3;
  // Problem says why the component is unhealthy.
  string problem = 4;
  // Build is which build of version runs, empty when the node can't
  // tell: for a node component, sha256: and the hex SHA-256 of the lines
  // "<file> <its hex SHA-256>\n" of its files, by the names a release
  // gives them, in order of name; for a cluster service, its image's
  // digest.
  string build = 5;
}

enum Health {
  HEALTH_UNSPECIFIED = 0;
  HEALTH_HEALTHY = 1;
  HEALTH_UNHEALTHY = 2;
}
