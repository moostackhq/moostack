syntax = "proto3";

// The node API: what a node's agent and updater serve about that one
// node.
package moostack.node.v1;

option go_package = "github.com/moostackhq/moostack/api/node/v1;nodev1";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// Agent is the node API that the agent serves.
service Agent {
  // Status reports the node's mode and the state of its node components.
  rpc Status(StatusRequest) returns (StatusResponse);
  // RecordGeneration records the generation of the cluster directory that
  // the node has applied, with the directory's nodes. It refuses a
  // generation lower than the one recorded, with FAILED_PRECONDITION,
  // unless the node can't tell the one recorded, and refuses it with
  // FAILED_PRECONDITION unless the request's lease holds the operation
  // lock.
  rpc RecordGeneration(RecordGenerationRequest) returns (RecordGenerationResponse);
  // AcquireLock grants the operation lock to the request's lease, if no
  // other lease holds it, or renews it for the lease that does. Either
  // way the lease holds it for ttl from when the agent got the call. It
  // answers with the lock as it now is, held by the request's lease or
  // by another.
  rpc AcquireLock(AcquireLockRequest) returns (AcquireLockResponse);
  // RenewLock renews the operation lock for the request's lease, for ttl
  // from when the agent got the call, only if that lease still holds it:
  // a lease that was broken or ran out never gets it back this way. It
  // answers with the lock as it now is, unset if free.
  rpc RenewLock(RenewLockRequest) returns (RenewLockResponse);
  // ReleaseLock releases the operation lock, if the request's lease holds
  // it.
  rpc ReleaseLock(ReleaseLockRequest) returns (ReleaseLockResponse);
  // BreakLock releases the operation lock, whichever lease holds it, and
  // answers with the lock it broke.
  rpc BreakLock(BreakLockRequest) returns (BreakLockResponse);
  // ImportImage imports an image into the node's containerd, from an OCI
  // image layout archive that the requests carry in chunks, in order. It
  // answers with the names of the images it imported. Importing an image
  // the node has changes nothing.
  rpc ImportImage(stream ImportImageRequest) returns (ImportImageResponse);
  // RunService runs a cluster service from its image, which the node must
  // have imported, and routes calls of its API to it from then on, across
  // restarts of the agent and the node. Running a service that already
  // runs as asked changes nothing; running a service of a name the node
  // runs already, at another version, from another image or of another
  // API, replaces it, and the API it served before is routed no more. It
  // refuses a service whose API a service of another name serves, with
  // FAILED_PRECONDITION.
  rpc RunService(RunServiceRequest) returns (RunServiceResponse);
  // RemoveIdentities adds node identities, by their fingerprints, to
  // those the node holds as removed from the cluster, and refuses peers
  // that prove one from then on, cutting off their open connections. The
  // node keeps the identities it held already, so the list only grows.
  // It refuses the request with FAILED_PRECONDITION unless the request's
  // lease holds the operation lock.
  rpc RemoveIdentities(RemoveIdentitiesRequest) returns (RemoveIdentitiesResponse);
}

// Updater is the node API that the updater serves, on its own socket, so
// that it answers whatever state the agent is in.
service Updater {
  // Status reports the updater's own state.
  rpc Status(UpdaterStatusRequest) returns (UpdaterStatusResponse);
  // UpdateAgent replaces the agent with the binary that the requests
  // carry: the first says which agent it is, and every request carries
  // the binary's next bytes, in order. The updater writes it into the
  // agent's inactive A/B slot, switches to that A/B slot and restarts the
  // agent, and answers once the new agent serves its status at the
  // update's version with every component it reports healthy. If it
  // doesn't within the update's health timeout, the updater switches
  // back, restarts the agent it replaced, and fails the call with
  // ABORTED, or with INTERNAL if the agent it replaced doesn't restart or
  // become healthy within the health timeout either. The call fails with
  // INTERNAL too if the new agent becomes healthy but the updater can't
  // remove the swap's record, since it then switches back when it next
  // starts. It refuses a binary that doesn't match the update's checksum
  // with INVALID_ARGUMENT, and, with FAILED_PRECONDITION, an update while
  // another runs or while a swap that didn't finish is recorded, changing
  // nothing. Once it has the whole binary, the update goes on even if the
  // call ends, and an updater told to stop finishes it first. One that
  // crashes before the new agent is healthy, or whose switch back failed,
  // switches back when it starts again.
  rpc UpdateAgent(stream UpdateAgentRequest) returns (UpdateAgentResponse);
}

message StatusRequest {}

message StatusResponse {
  Mode mode = 1;
  // Components are the node components, the agent among them. The
  // updater reports itself.
  repeated Component components = 2;
  // Generation is the generation of the cluster directory that the node
  // last applied, 0 if none or if generation_unknown says why the node
  // can't tell.
  int64 generation = 3;
  // Nodes are the names of the nodes in the cluster directory at that
  // generation.
  repeated string nodes = 4;
  // GenerationUnknown says why the node can't tell the generation it last
  // applied, such as a file it can't read. It is empty when it can.
  string generation_unknown = 5;
  // Lock is the operation lock, unset if no lease holds it.
  Lock lock = 6;
  // Services are the cluster services the node runs, each at the version
  // it was run at, and healthy if it answers its health call without a
  // problem.
  repeated Component services = 7;
}

// RecordGenerationRequest is a generation of the cluster directory that
// the node has applied.
message RecordGenerationRequest {
  // Generation is the cluster directory's generation.
  int64 generation = 1;
  // Nodes are the names of the nodes in the cluster directory at that
  // generation.
  repeated string nodes = 2;
  // Lease is the operation's lease, which must hold the operation lock.
  string lease = 3;
}

message RecordGenerationResponse {}

// Lock is the operation lock, as one operation's lease holds it.
message Lock {
  // Lease identifies the operation's hold on the lock.
  string lease = 1;
  // Holder is who runs the operation, and machine where.
  string holder = 2;
  string machine = 3;
  // Since is when the node granted the lease. A request leaves it unset.
  google.protobuf.Timestamp since = 4;
  // Until is when the lease runs out on the node unless renewed, on the
  // node's clock. A request leaves it unset.
  google.protobuf.Timestamp until = 5;
}

message AcquireLockRequest {
  Lock lock = 1;
  // Ttl is how long the lease holds the lock unless renewed.
  google.protobuf.Duration ttl = 2;
}

message AcquireLockResponse {
  // Lock is the lock as it now is.
  Lock lock = 1;
}

message RenewLockRequest {
  string lease = 1;
  google.protobuf.Duration ttl = 2;
}

message RenewLockResponse {
  // Lock is the lock as it now is, unset if free.
  Lock lock = 1;
}

message ReleaseLockRequest {
  string lease = 1;
}

message ReleaseLockResponse {}

message BreakLockRequest {}

message BreakLockResponse {
  // Broken is the lock that was broken, unset if no lease held it.
  Lock broken = 1;
}

message ImportImageRequest {
  // Chunk is the archive's next bytes.
  bytes chunk = 1;
}

message ImportImageResponse {
  // Images are the names of the images imported.
  repeated string images = 1;
}

// Service is a cluster service as a node runs it.
message Service {
  // Name is the service's, such as registry.
  string name = 1;
  string version = 2;
  // Api is the gRPC service name of the service's API, which the agent
  // routes calls to the service by.
  string api = 3;
  // Image is the name of the service's image in the node's containerd.
  string image = 4;
}

message RunServiceRequest {
  Service service = 1;
}

message RunServiceResponse {}

message RemoveIdentitiesRequest {
  // Identities are the fingerprints of the removed identities: each the
  // SHA-256 of the certificate, hex, after "sha256:".
  repeated string identities = 1;
  // Lease is the operation's lease, which must hold the operation lock.
  string lease = 2;
}

message RemoveIdentitiesResponse {}

message UpdaterStatusRequest {}

message UpdaterStatusResponse {
  // Updater is the updater itself.
  Component updater = 1;
}

message UpdateAgentRequest {
  // Update says which agent the binary is. The first request carries it,
  // and the others don't.
  AgentUpdate update = 1;
  // Chunk is the binary's next bytes.
  bytes chunk = 2;
}

// AgentUpdate is the agent that an update installs.
message AgentUpdate {
  // Version is the version the new agent reports.
  string version = 1;
  // Sha256 is the binary's SHA-256, hex.
  string sha256 = 2;
  // HealthTimeout is how long the new agent has to become healthy.
  google.protobuf.Duration health_timeout = 3;
}

message UpdateAgentResponse {}

// Mode is how the node is operated.
enum Mode {
  MODE_UNSPECIFIED = 0;
  // MODE_DIRECT is operated by mooctl over SSH.
  MODE_DIRECT = 1;
  // MODE_CONTROL_PLANE is operated by a control plane.
  MODE_CONTROL_PLANE = 2;
}

// Component is a node component or a cluster service as the agent or the
// updater sees it.
message Component {
  // Name is agent, updater or containerd, or the cluster service's.
  string name = 1;
  // Version is empty when the agent can't tell it.
  string version = 2;
  Health health = 3;
  // Problem says why the component is unhealthy.
  string problem = 4;
}

enum Health {
  HEALTH_UNSPECIFIED = 0;
  HEALTH_HEALTHY = 1;
  HEALTH_UNHEALTHY = 2;
}
