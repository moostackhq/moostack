# The cluster services are static musl binaries. rustc's own crt objects
# and rust-lld link them, so building for another architecture needs no
# cross toolchain.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]
