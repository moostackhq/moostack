name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go generate ./internal/console
          git diff --exit-code internal/console/static
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          go vet ./...
          go test -timeout 30m ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${platform%/*}
            arch=${platform#*/}
            dir=$(mktemp -d)
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags=-s -tags release -o "$dir/mooctl" ./cmd/mooctl
            cp LICENSE "$dir/"
            tar -C "$dir" -czf "dist/mooctl-$os-$arch.tar.gz" mooctl LICENSE
          done
          for arch in amd64 arm64; do
            dir=$(mktemp -d)
            GOOS=linux GOARCH=$arch go build -trimpath -ldflags=-s -o "$dir/console" ./cmd/console
            cp LICENSE "$dir/"
            docker buildx build --file cmd/console/Dockerfile --platform "linux/$arch" \
              --provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH=0 \
              --output "type=oci,dest=dist/console-linux-$arch.tar,rewrite-timestamp=true" "$dir"
          done
          cd dist
          sha256sum mooctl-*.tar.gz console-*.tar > sha256sums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="mooctl and console built from main at $GITHUB_SHA."
          if gh release view edge >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/edge" -f sha="$GITHUB_SHA" -F force=true
            gh release upload edge dist/* --clobber
            gh release edit edge --notes "$notes"
          else
            gh release create edge dist/* --prerelease --target "$GITHUB_SHA" --title edge --notes "$notes"
          fi
