---
apiVersion: v1
data:
    DB_PASSWORD: cA==
kind: Secret
metadata:
    labels:
        moostack.dev/app: drupal
    name: drupal
    namespace: drupal
type: Opaque
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    labels:
        moostack.dev/app: drupal
        moostack.dev/container: db
    name: db-data
    namespace: drupal
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
    labels:
        moostack.dev/app: drupal
        moostack.dev/container: db
    name: db
    namespace: drupal
spec:
    replicas: 1
    selector:
        matchLabels:
            moostack.dev/app: drupal
            moostack.dev/container: db
    strategy:
        type: Recreate
    template:
        metadata:
            annotations:
                moostack.dev/secrets: cbfd56b4ab560dd3aad2d2a254a9c70cafc4c662a44e4e5a18d39891d6393df7
            labels:
                moostack.dev/app: drupal
                moostack.dev/container: db
        spec:
            containers:
                - env:
                    - name: MARIADB_PASSWORD
                      valueFrom:
                        secretKeyRef:
                            key: DB_PASSWORD
                            name: drupal
                  image: mariadb:11.4
                  name: db
                  ports:
                    - containerPort: 3306
                  readinessProbe:
                    exec:
                        command:
                            - healthcheck.sh
                            - --connect
                    periodSeconds: 2
                  volumeMounts:
                    - mountPath: /var/lib/mysql
                      name: data
            volumes:
                - name: data
                  persistentVolumeClaim:
                    claimName: db-data
---
apiVersion: v1
kind: Service
metadata:
    labels:
        moostack.dev/app: drupal
        moostack.dev/container: db
    name: db
    namespace: drupal
spec:
    ports:
        - port: 3306
          targetPort: 3306
    selector:
        moostack.dev/app: drupal
        moostack.dev/container: db
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    labels:
        moostack.dev/app: drupal
        moostack.dev/container: web
    name: web-files
    namespace: drupal
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    labels:
        moostack.dev/app: drupal
        moostack.dev/container: web
    name: web-private
    namespace: drupal
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
    labels:
        moostack.dev/app: drupal
        moostack.dev/container: web
    name: web
    namespace: drupal
spec:
    replicas: 1
    selector:
        matchLabels:
            moostack.dev/app: drupal
            moostack.dev/container: web
    strategy:
        rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
    template:
        metadata:
            annotations:
                moostack.dev/secrets: cbfd56b4ab560dd3aad2d2a254a9c70cafc4c662a44e4e5a18d39891d6393df7
            labels:
                moostack.dev/app: drupal
                moostack.dev/container: web
        spec:
            containers:
                - env:
                    - name: DB_PASSWORD
                      valueFrom:
                        secretKeyRef:
                            key: DB_PASSWORD
                            name: drupal
                    - name: DRUPAL_HOST
                      value: drupal.example.com
                  image: moostack.local/drupal/web@sha256:5555
                  lifecycle:
                    preStop:
                        sleep:
                            seconds: 5
                  name: web
                  ports:
                    - containerPort: 80
                  readinessProbe:
                    httpGet:
                        httpHeaders:
                            - name: Host
                              value: drupal.example.com
                        path: /user/login
                        port: 80
                    periodSeconds: 2
                  volumeMounts:
                    - mountPath: /opt/drupal/web/sites/default/files
                      name: files
                    - mountPath: /opt/drupal/private
                      name: private
            initContainers:
                - command:
                    - drupal-install
                  env:
                    - name: DB_PASSWORD
                      valueFrom:
                        secretKeyRef:
                            key: DB_PASSWORD
                            name: drupal
                    - name: DRUPAL_HOST
                      value: drupal.example.com
                  image: moostack.local/drupal/web@sha256:5555
                  name: pre-start
                  securityContext:
                    runAsGroup: 33
                    runAsUser: 33
                  volumeMounts:
                    - mountPath: /opt/drupal/web/sites/default/files
                      name: files
                    - mountPath: /opt/drupal/private
                      name: private
            terminationGracePeriodSeconds: 35
            volumes:
                - name: files
                  persistentVolumeClaim:
                    claimName: web-files
                - name: private
                  persistentVolumeClaim:
                    claimName: web-private
---
apiVersion: batch/v1
kind: CronJob
metadata:
    labels:
        moostack.dev/app: drupal
        moostack.dev/container: web
    name: web-drupal
    namespace: drupal
spec:
    concurrencyPolicy: Forbid
    jobTemplate:
        spec:
            template:
                metadata:
                    labels:
                        moostack.dev/app: drupal
                        moostack.dev/cron: drupal
                spec:
                    containers:
                        - command:
                            - drush
                            - cron
                          env:
                            - name: DB_PASSWORD
                              valueFrom:
                                secretKeyRef:
                                    key: DB_PASSWORD
                                    name: drupal
                            - name: DRUPAL_HOST
                              value: drupal.example.com
                          image: moostack.local/drupal/web@sha256:5555
                          name: drupal
                          securityContext:
                            runAsUser: 33
                          volumeMounts:
                            - mountPath: /opt/drupal/web/sites/default/files
                              name: files
                            - mountPath: /opt/drupal/private
                              name: private
                    restartPolicy: Never
                    volumes:
                        - name: files
                          persistentVolumeClaim:
                            claimName: web-files
                        - name: private
                          persistentVolumeClaim:
                            claimName: web-private
    schedule: '*/5 * * * *'
---
apiVersion: batch/v1
kind: CronJob
metadata:
    labels:
        moostack.dev/app: drupal
        moostack.dev/container: web
    name: web-report
    namespace: drupal
spec:
    concurrencyPolicy: Forbid
    jobTemplate:
        spec:
            template:
                metadata:
                    labels:
                        moostack.dev/app: drupal
                        moostack.dev/cron: report
                spec:
                    containers:
                        - command:
                            - drush
                            - report
                          env:
                            - name: DB_PASSWORD
                              valueFrom:
                                secretKeyRef:
                                    key: DB_PASSWORD
                                    name: drupal
                            - name: DRUPAL_HOST
                              value: drupal.example.com
                          image: moostack.local/drupal/web@sha256:5555
                          name: report
                          volumeMounts:
                            - mountPath: /opt/drupal/web/sites/default/files
                              name: files
                            - mountPath: /opt/drupal/private
                              name: private
                    restartPolicy: Never
                    volumes:
                        - name: files
                          persistentVolumeClaim:
                            claimName: web-files
                        - name: private
                          persistentVolumeClaim:
                            claimName: web-private
    schedule: 0 3 * * 1
---
apiVersion: v1
kind: Service
metadata:
    labels:
        moostack.dev/app: drupal
        moostack.dev/container: web
    name: web
    namespace: drupal
spec:
    ports:
        - port: 80
          targetPort: 80
    selector:
        moostack.dev/app: drupal
        moostack.dev/container: web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    annotations:
        cert-manager.io/cluster-issuer: moostack
    labels:
        moostack.dev/app: drupal
        moostack.dev/container: web
    name: web
    namespace: drupal
spec:
    ingressClassName: traefik
    rules:
        - host: drupal.example.com
          http:
            paths:
                - backend:
                    service:
                        name: web
                        port:
                            number: 80
                  path: /
                  pathType: Prefix
    tls:
        - hosts:
            - drupal.example.com
          secretName: web-tls
---
apiVersion: apps/v1
kind: Deployment
metadata:
    labels:
        moostack.dev/app: drupal
        moostack.dev/container: probe
    name: probe
    namespace: drupal
spec:
    replicas: 1
    selector:
        matchLabels:
            moostack.dev/app: drupal
            moostack.dev/container: probe
    strategy:
        rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
    template:
        metadata:
            labels:
                moostack.dev/app: drupal
                moostack.dev/container: probe
        spec:
            containers:
                - image: example.test/probe:1
                  name: probe
                  ports:
                    - containerPort: 8080
                  readinessProbe:
                    httpGet:
                        path: /up
                        port: 8080
                    periodSeconds: 2
            initContainers:
                - command:
                    - warm
                  image: example.test/probe:1
                  name: pre-start
---
apiVersion: v1
kind: Service
metadata:
    labels:
        moostack.dev/app: drupal
        moostack.dev/container: probe
    name: probe
    namespace: drupal
spec:
    ports:
        - port: 8080
          targetPort: 8080
    selector:
        moostack.dev/app: drupal
        moostack.dev/container: probe
