<!doctype html>
<html lang="en">
{{template "head"}}
<body>
<main class="mx-auto mt-24 w-xs">
<h1 class="text-xl font-bold">Console</h1>
{{- if .Problem}}
<p role="alert" class="alert alert-error mt-4">{{.Problem}}</p>
{{- end}}
<form method="post" action="/console/login" class="fieldset bg-base-200 border-base-300 rounded-box mt-4 border p-4">
<label for="token" class="label">Token</label>
<input class="input" id="token" name="token" type="password" autocomplete="off" required autofocus>
<button class="btn btn-neutral mt-4">Log in</button>
</form>
</main>
</body>
</html>
